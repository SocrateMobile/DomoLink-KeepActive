<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#16223f" />
    </linearGradient>

    <!-- Neon Cyan Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Electric Shock Glow Filter -->
    <filter id="shockGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Defibrillator Bezel Gradient -->
    <linearGradient id="defibBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- ECG Screen Gradient -->
    <radialGradient id="screenGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#062238" />
      <stop offset="60%" stop-color="#041224" />
      <stop offset="100%" stop-color="#020612" />
    </radialGradient>

    <!-- Electric Lightning Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>

    <!-- Paddle Electrode Gradient -->
    <linearGradient id="paddleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Squircle Container (DomoLink Signature Style) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="4" />

  <!-- Cyber Blueprint Grid & Target Circles -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5">
    <circle cx="256" cy="270" r="190" fill="none" stroke-dasharray="6,6" />
    <circle cx="256" cy="270" r="145" fill="none" stroke-dasharray="4,4" />
    <line x1="256" y1="40" x2="256" y2="70" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5" />
    <line x1="256" y1="470" x2="256" y2="500" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5" />
    <line x1="40" y1="270" x2="70" y2="270" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5" />
    <line x1="442" y1="270" x2="472" y2="270" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5" />
  </g>

  <!-- HUD Viewfinder Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 68 115 L 68 76 A 8 8 0 0 1 76 68 L 115 68" />
    <path d="M 397 68 L 436 68 A 8 8 0 0 1 444 76 L 444 115" />
    <path d="M 68 397 L 68 436 A 8 8 0 0 0 76 444 L 115 444" />
    <path d="M 397 444 L 436 444 A 8 8 0 0 0 444 436 L 444 397" />
  </g>

  <!-- Defibrillator Handle / Top Bracket -->
  <path d="M 196 92 C 196 66 316 66 316 92 L 302 92 C 302 76 210 76 210 92 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="203" cy="92" r="3" fill="#64748b" />
  <circle cx="309" cy="92" r="3" fill="#64748b" />

  <!-- Main Defibrillator Monitor Bezel -->
  <rect x="96" y="112" width="320" height="296" rx="36" fill="url(#titaniumGrad)" stroke="url(#defibBezel)" stroke-width="4.5" filter="url(#neonGlow)" />
  
  <!-- Inner Glass Screen -->
  <rect x="114" y="130" width="284" height="236" rx="22" fill="url(#screenGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />

  <!-- Subtle ECG Oscilloscope Grid -->
  <g stroke="rgba(0, 245, 212, 0.08)" stroke-width="1">
    <line x1="114" y1="189" x2="398" y2="189" />
    <line x1="114" y1="248" x2="398" y2="248" />
    <line x1="114" y1="307" x2="398" y2="307" />
    <line x1="172" y1="130" x2="172" y2="366" />
    <line x1="256" y1="130" x2="256" y2="366" />
    <line x1="340" y1="130" x2="340" y2="366" />
  </g>

  <!-- Glowing Heart Silhouette Outline Behind ECG -->
  <path d="M 256 288 C 224 252 178 224 178 184 C 178 156 200 142 226 142 C 244 142 254 152 256 156 C 258 152 268 142 286 142 C 312 142 334 156 334 184 C 334 224 288 252 256 288 Z"
        fill="rgba(56, 189, 248, 0.06)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Dynamic Defibrillator ECG Rhythm Trace (Steady Pulse into High-Voltage Defibrillation Shock) -->
  <path d="M 118 248 L 158 248 L 168 238 L 178 254 L 188 248 L 222 248 L 232 268 L 246 148 L 264 336 L 278 232 L 290 256 L 302 248 L 334 248 L 344 238 L 354 254 L 364 248 L 394 248"
        fill="none" stroke="#00f5d4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shockGlow)" />
  <path d="M 118 248 L 158 248 L 168 238 L 178 254 L 188 248 L 222 248 L 232 268 L 246 148 L 264 336 L 278 232 L 290 256 L 302 248 L 334 248 L 344 238 L 354 254 L 364 248 L 394 248"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Electric Defibrillation Shockbolt (Lightning Spike) -->
  <polygon points="266,134 238,220 262,220 244,306 288,206 264,206"
           fill="url(#lightningGrad)" stroke="#ffffff" stroke-width="1.8" filter="url(#shockGlow)" opacity="0.95" />

  <!-- Defibrillator Shock Paddles / Electrodes (Left & Right) -->
  <!-- Left Paddle -->
  <g id="leftPaddle" transform="translate(42, 210)">
    <!-- Paddle Wire -->
    <path d="M 24 38 Q 4 48 24 64 Q 44 80 54 90" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" />
    <!-- Paddle Body -->
    <rect x="8" y="10" width="30" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Metallic Electrode Contact Face -->
    <rect x="34" y="14" width="8" height="48" rx="3" fill="url(#paddleGrad)" stroke="#94a3b8" stroke-width="1" />
    <!-- Spark Discharges -->
    <circle cx="48" cy="22" r="3.5" fill="#00f5d4" filter="url(#neonGlow)" />
    <circle cx="50" cy="54" r="2.5" fill="#38bdf8" filter="url(#neonGlow)" />
  </g>

  <!-- Right Paddle -->
  <g id="rightPaddle" transform="translate(432, 210)">
    <!-- Paddle Wire -->
    <path d="M 14 38 Q 34 48 14 64 Q -6 80 -16 90" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" />
    <!-- Paddle Body -->
    <rect x="0" y="10" width="30" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Metallic Electrode Contact Face -->
    <rect x="-4" y="14" width="8" height="48" rx="3" fill="url(#paddleGrad)" stroke="#94a3b8" stroke-width="1" />
    <!-- Spark Discharges -->
    <circle cx="-10" cy="22" r="3.5" fill="#00f5d4" filter="url(#neonGlow)" />
    <circle cx="-12" cy="54" r="2.5" fill="#38bdf8" filter="url(#neonGlow)" />
  </g>

  <!-- Energy Arc Rays (Shockwaves) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 234 140 A 30 30 0 0 1 278 140" stroke="#00f5d4" stroke-width="3" filter="url(#neonGlow)" />
    <path d="M 218 126 A 50 50 0 0 1 294 126" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />
  </g>

  <!-- Defibrillator Control Panel / Lower Shelf -->
  <g transform="translate(114, 376)">
    <!-- Ready Status LED -->
    <circle cx="20" cy="14" r="5" fill="#10b981" filter="url(#neonGlow)" />
    <circle cx="20" cy="14" r="2.2" fill="#ffffff" />
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" font-weight="800" fill="#34d399" letter-spacing="1">DEFIB ACTIVE</text>

    <!-- Shock Discharge Counter / Energy Gauge -->
    <text x="210" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">200J • PING</text>
  </g>
</svg>
